name: Build Minecraft Mod

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Make Gradle executable
        run: find . -name "gradlew" -exec chmod +x {} +
      - name: Build with Gradle
        run: |
          GRADLE_WRAPPUP=$(find . -name "gradlew" -print -quit)
          if [ -n "$GRADLE_WRAPPUP" ]; then
            DIR=$(dirname "$GRADLE_WRAPPUP")
            cd "$DIR" && ./gradlew build
          else
            echo "gradlew bulunamadı!"
            exit 1
          fi
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Korkumod-Jar
          path: '**/build/libs/*.jar'
